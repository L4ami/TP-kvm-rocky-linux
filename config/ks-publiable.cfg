# Kickstart - TP KVM sur Rocky Linux 9.8
# Installation automatique en mode texte, KVM installe pendant l'installation
text
cdrom
eula --agreed
firstboot --disable

# Langue, clavier, fuseau horaire
lang fr_FR.UTF-8
keyboard --vckeymap=ch-fr --xlayouts='ch (fr)'
timezone Europe/Zurich --utc

# Reseau
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=kvm-rocky

# Disque : on efface tout et on partitionne automatiquement
zerombr
clearpart --all --initlabel
autopart

# Comptes
rootpw --lock
user --name=lami --groups=wheel --iscrypted --password=<MOT_DE_PASSE_MASQUE>
sshkey --username=lami "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHZxeFP21PpP6zvDsaomKdtaG9mKi8QDgi1CpbJ36Vvu lami@kvm-rocky"

# Services
services --enabled=sshd

%packages --ignoremissing
@^virtualization-host-environment
open-vm-tools
virt-install
guestfs-tools
%end

reboot
